name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package and browsers
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m playwright install chromium
          python -m patchright install chromium
      # Keep each test module visible as its own check. This makes a
      # cross-platform failure diagnosable without exposing secrets or logs.
      - name: Test audit logging
        if: always()
        run: python -X faulthandler -m unittest discover -s tests -p "test_audit_log.py" -v
      - name: Test authentication
        if: always()
        run: python -X faulthandler -m unittest discover -s tests -p "test_auth.py" -v
      - name: Test CLI
        if: always()
        run: python -X faulthandler -m unittest discover -s tests -p "test_cli.py" -v
      - name: Test configuration
        if: always()
        run: python -X faulthandler -m unittest discover -s tests -p "test_config.py" -v
      - name: Test content extraction
        if: always()
        run: python -X faulthandler -m unittest discover -s tests -p "test_content.py" -v
      - name: Test cookies
        if: always()
        run: python -X faulthandler -m unittest discover -s tests -p "test_cookies.py" -v
      - name: Test egress proxy
        if: always()
        run: python -X faulthandler -m unittest discover -s tests -p "test_egress.py" -v
      - name: Test engine
        if: always()
        run: python -X faulthandler -m unittest discover -s tests -p "test_engine.py" -v
      - name: Test MCP stdio protocol
        if: always()
        run: python -X faulthandler -m unittest discover -s tests -p "test_mcp.py" -v
      - name: Test process cleanup
        if: always()
        run: python -X faulthandler -m unittest discover -s tests -p "test_processes.py" -v
      - name: Test terminal cookie redaction
        if: always()
        run: python -X faulthandler -m unittest tests.test_terminal.TerminalTests.test_cookie_summary_hides_cookie_and_storage_values -v
      - name: Test terminal tool switch
        if: always()
        run: python -X faulthandler -m unittest tests.test_terminal.TerminalTests.test_terminal_can_toggle_a_tool -v
      - name: Test terminal restart report
        if: always()
        run: python -X faulthandler -m unittest tests.test_terminal.TerminalTests.test_restart_reports_when_no_client_owned_server_is_found -v
      - name: Test terminal help
        if: always()
        run: python -X faulthandler -m unittest tests.test_terminal.TerminalTests.test_help_documents_restart_command -v
      - name: Test terminal agent guide
        if: always()
        run: python -X faulthandler -m unittest tests.test_terminal.TerminalTests.test_agent_guide_is_available_without_local_secrets -v
      - name: Test terminal agent guide JSON
        if: always()
        run: python -X faulthandler -m unittest tests.test_terminal.TerminalTests.test_agent_guide_json_is_copyable -v
      - name: Test machine-specific connection paths
        if: always()
        run: python -X faulthandler -m unittest tests.test_terminal.TerminalTests.test_connection_config_uses_the_target_machine_paths -v
      - name: Test terminal startup
        if: always()
        run: python -X faulthandler -m unittest tests.test_terminal.TerminalTests.test_interactive_startup_only_shows_connection_info -v
